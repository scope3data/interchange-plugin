name: Validate Claude Plugin

# Runs Anthropic's own `claude plugin validate --strict` against this
# repo's manifest — the mirror-side half of the check the source repo
# (scope3data/agentic-api) already runs in
# .github/workflows/validate-claude-plugin.yml before content ever reaches
# here. This confirms the manifest validates standalone, without the
# private repo's context, per the Plugin Directory submission runbook in
# docs/spec/sales-agents/claude-plugin-public-mirror.md.
#
# Bump CLAUDE_CODE_VERSION deliberately when validating against a newer CLI
# release; it is pinned, not @latest, so this check is reproducible.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CLAUDE_CODE_VERSION: 2.1.251

jobs:
  validate-claude-plugin:
    name: Validate Claude Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin manifest
        run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict .
